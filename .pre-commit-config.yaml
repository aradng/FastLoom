default_language_version:
    python: python3.13
repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: check-yaml
          - id: check-added-large-files
    - repo: https://github.com/tsvikas/sync-with-uv
      rev: v0.6.0
      hooks:
          - id: sync-with-uv
    - repo: https://github.com/pre-commit/mirrors-mypy
      rev: v2.3.0
      hooks:
      -   id: mypy
          additional_dependencies:
            - mypy-extensions==1.1.0  # sync-with-uv
            - "typing-extensions==4.16.0"  # sync-with-uv
            - "pydantic==2.13.4"  # sync-with-uv
            - "returns"
            - "types-pyyaml==6.0.12.20260518"  # sync-with-uv
            - "starlette>=0.40.0,<2.0.0"
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.15.21
      hooks:
        - id: ruff
          args: [ --fix ]
        - id: ruff-format
    - repo: https://github.com/astral-sh/uv-pre-commit
      rev: 0.12.19
      hooks:
        - id: uv-lock
    - repo: local
      hooks:
        - id: plugin-version-sync
          name: plugin-version-sync
          language: system
          entry: python3 scripts/check_plugin_version.py
          files: ^(pyproject\.toml|plugins/fastloom-sdk/\.claude-plugin/plugin\.json)$
          pass_filenames: false
