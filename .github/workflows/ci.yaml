name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-env

      - name: Run pre-commit
        run: |
          uv run prek run --all-files --show-diff-on-failure
          git diff --quiet || (echo "Code formatting failed"; git --no-pager diff; exit 1)

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-env

      - name: Run pytest
        run: uv run pytest

  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    needs: [static-analysis, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-env

      - name: Build
        run: uv build
        shell: bash

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish
